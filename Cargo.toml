[workspace]
members = [
    "crates/glypr-core",
    "crates/glypr",
    "crates/glypr-server",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Guillermo Estrada <213238+phrozen@users.noreply.github.com>"]
license = "Apache-2.0"
repository = "https://github.com/phrozen/glypr"
homepage = "https://github.com/phrozen/glypr"
documentation = "https://docs.rs/glypr-core"
readme = "README.md"
keywords = ["embeddings", "gemma", "metal", "coreml", "multimodal"]
categories = ["science", "multimedia", "command-line-utilities"]
description = "Native Rust embedding and retrieval engine for EmbeddingGemma 2"

[workspace.dependencies]
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
safetensors = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
bytemuck = "1.14"
half = "2.3"
ahash = "0.8.12"
candle-metal-kernels = { version = "0.11.0", default-features = false }
objc2-metal = { version = "0.3.2", default-features = false }
coreml-native = { version = "0.2.0", default-features = false }
pulp = { version = "0.22.3", features = ["macro"] }
libc = "0.2"
rayon = "1.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
hound = "3.5"
hf-hub = "0.4"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
base64 = "0.23"

[profile.test]
opt-level = 3
