[package]
name = "glypr"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Rust CLI and embedding tool for EmbeddingGemma 2"

[features]
default = []
metal = ["glypr-core/metal", "glypr-server/metal"]
accelerate = ["glypr-core/accelerate", "glypr-server/accelerate"]
coreml = ["glypr-core/coreml", "glypr-server/coreml"]
ane = ["coreml"]

[dependencies]
glypr-core = { path = "../glypr-core" }
glypr-server = { path = "../glypr-server" }
candle-core = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
hound = { workspace = true }
bytemuck = { workspace = true }

[[bin]]
name = "glypr"
path = "src/main.rs"
