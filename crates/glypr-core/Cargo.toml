[package]
name = "glypr-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core embedding & inference engine for EmbeddingGemma 2"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal", "dep:candle-metal-kernels", "dep:objc2-metal"]
accelerate = ["candle-core/accelerate"]
metal-flash-attn = ["metal"]
cuda-flash-attn = []
coreml = ["dep:coreml-native"]
ane = ["coreml"]

[dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-metal-kernels = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
tokenizers = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
bytemuck = { workspace = true }
half = { workspace = true }
ahash = { workspace = true }
pulp = { workspace = true }
libc = { workspace = true }
rayon = { workspace = true }
image = { workspace = true }
hound = { workspace = true }
hf-hub = { workspace = true }
coreml-native = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.5"

[[example]]
name = "bench_memory"
required-features = ["metal"]

[[example]]
name = "compare_models"
required-features = ["metal"]

[[example]]
name = "test_autorelease"
required-features = ["metal"]

[[example]]
name = "probe_layers"
required-features = ["metal"]

[[example]]
name = "probe_candle_metal"
required-features = ["metal"]

[[example]]
name = "test_coreml"
required-features = ["coreml"]

